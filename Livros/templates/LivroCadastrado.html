{% extends "base.html" %}
{% load static %}

{% block title %}Livro cadastrado{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/livro_form.css' %}">
{% endblock %}

{% block content %}
<div class="geral">
    <div class="sucesso" role="status">
        <svg class="sucesso-icone" viewBox="0 0 56 56" aria-hidden="true" focusable="false">
            <circle cx="28" cy="28" r="26" />
            <path d="M17 29 l8 8 l14 -17" />
        </svg>

        <h1>Livro cadastrado</h1>
        <p>Ele já aparece no catálogo.</p>

        <div class="sucesso-acoes">
            <a href="{% url 'livros' %}" class="btn btn-warning">Cadastrar outro livro</a>
            <a href="{% url 'home' %}" class="aviso-link">Ver o catálogo</a>
        </div>
    </div>
</div>
{% endblock %}
