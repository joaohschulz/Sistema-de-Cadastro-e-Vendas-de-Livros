{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} · eBook Here</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
    <a class="pular" href="#conteudo">Ir para o formulário</a>

    <div class="auth-layout">
        <div class="auth-coluna">
            <header class="auth-topo">
                <a href="{% url 'home' %}" class="marca">eBook Here</a>
                <a href="{% url 'home' %}" class="auth-voltar">Ver o catálogo</a>
            </header>

            <main id="conteudo" class="auth-centro">
                <div class="auth-bloco">
                    {% block auth_conteudo %}{% endblock %}
                </div>
            </main>
        </div>

        <div class="painel">
            <p class="painel-frase">{% block painel_frase %}{% endblock %}</p>

            {# Decorativo: lombadas de livros desenhadas em CSS #}
            <div class="estante" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>
</body>

</html>
